# RoboRacer simulator container (ROS 2 Jazzy, f1tenth_gym_ros dev-jazzy).
# Everything ROS-related runs in here; the host stays on its own ROS 2 Humble.
#
#   scripts/sim_up.sh --build                                  # first time
#   scripts/launch_sim.sh                                      # bridge + map
#   scripts/rviz.sh                                            # RViz over X11
#
# Host networking is deliberate: Foxglove (ws://localhost:8765) and any host
# tools see the container's ROS graph without port juggling.
services:
  # Upstream simulator image, built from the submodule. Never runs; only a build
  # target (profile "build"). scripts/sim_up.sh --build builds it before "sim".
  base:
    image: roboracer_base:jazzy
    profiles: [build]
    build:
      context: ./f1tenth_gym_ros
      args:
        ROS_DISTRO: jazzy
        GYM_REF: dev-jax

  sim:
    image: roboracer_sim:jazzy
    container_name: roboracer_sim
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: roboracer_base:jazzy
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Host X runs on the Intel iGPU with the RTX as a PRIME offload provider.
      # These two make GL apps in the container (rviz2, gym renderer) use the RTX.
      # Drop them to fall back to Mesa on the Intel iGPU via /dev/dri.
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      # simulator source (edit sim.yaml on the host, rebuild in the container)
      - ./f1tenth_gym_ros:/sim_ws/src/f1tenth_gym_ros
      # lab workspace (edit on host, colcon build in container)
      - ../labs/ws:/labs_ws
      # X11 socket so rviz2 can open a window on the host display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # GPU via CDI (Container Device Interface). No nvidia runtime registration
    # needed: `docker info` already lists nvidia.com/gpu=all. Gives RViz hardware
    # GL and lets you `pip install -e /sim_ws/f1tenth_gym[cuda]` for GPU JAX later.
    # If the container ever fails to start with a CDI error, comment out `devices:`
    # and add `- LIBGL_ALWAYS_SOFTWARE=1` to environment.
    devices:
      - nvidia.com/gpu=all
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
