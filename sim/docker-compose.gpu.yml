# GPU override for the sim service. Stacked on docker-compose.yml by
# scripts/_common.sh when the mode is gpu (scripts/sim_up.sh --gpu, or auto
# when the host NVIDIA stack is healthy). Never use it on its own.
#
# GPU via CDI (Container Device Interface). No nvidia runtime registration
# needed: `docker info` already lists nvidia.com/gpu=all. Gives RViz hardware
# GL and lets you `pip install -e /sim_ws/f1tenth_gym[cuda]` for GPU JAX later.
#
# Known failure: after an unattended NVIDIA driver upgrade the host needs a
# reboot; until then nvidia-persistenced is down, the CDI mount of
# /run/nvidia-persistenced/socket fails and the container will not start.
# Use scripts/sim_up.sh --cpu (or let auto pick it) in the meantime.
services:
  sim:
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Host X runs on the Intel iGPU with the RTX as a PRIME offload provider.
      # These two make GL apps in the container (rviz2, gym renderer) use the RTX.
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    devices:
      - nvidia.com/gpu=all
